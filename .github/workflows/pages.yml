name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Copy only the public site, then stamp every ?v=dev asset URL with the
      # commit so each deploy gets fresh CSS/JS URLs past GitHub Pages' 10-minute cache.
      - name: Build site
        run: |
          mkdir _site
          cp -R index.html chordgrid.html styles.css script.js assets chordgrid _site/
          version="${GITHUB_SHA::8}"
          find _site -name '*.html' -exec sed -i "s/?v=dev\"/?v=${version}\"/g" {} +
          if grep -rn '?v=dev"' _site; then
            echo "Unstamped asset URLs remain" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
